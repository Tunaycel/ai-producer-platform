name: 🤖 PR Auto Labeler & Stale Issue Cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * *'  # Nightly stale check at 00:00

jobs:
  auto-label:
    name: 🏷️ Automatically Label Pull Requests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  stale-issues:
    name: 🧹 Mark & Close Stale Issues/PRs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has been inactive for 30 days and will be closed soon."
          stale-pr-message: "This PR hasn't been updated in 14 days and will be closed soon. Please share a status update."
          close-issue-message: "Closed due to inactivity. Feel free to reopen if needed."
          close-pr-message: "Closed due to inactivity."
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-issue-close: 7
          days-before-pr-close: 7
          exempt-issue-labels: 'pinned,security,critical'
          exempt-pr-labels: 'pinned,security,hotfix'
