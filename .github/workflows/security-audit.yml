name: Security & Dependency Audit (SAST)

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'  # Runs automatically every Monday at 03:00

jobs:
  secret-scan:
    name: Secret & Credentials Leak Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Scan the full commit history

      - name: TruffleHog — Full Git History Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  sast-scan:
    name: Static Application Security Testing (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Bandit SAST Tool
        run: pip install bandit

      - name: Run Bandit Security Scan (Python)
        run: |
          bandit -r src/ -ll -ii --format json -o bandit-report.json || true
          bandit -r src/ -ll -ii

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  dependency-audit:
    name: Dependency Vulnerability Check (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Dependencies for Known CVEs
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --format=json -o pip-audit-report.json || true
            pip-audit -r requirements.txt
          else
            echo "requirements.txt not found — skipping dependency audit."
          fi
