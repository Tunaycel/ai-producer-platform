name: Code Audit & Quality Check

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  audit-and-test:
    name: Code Audit & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Linting, typing and the test suite are owned by code-quality.yml and
      # tests.yml. This job only covers what those two do not: credentials
      # committed into source, and untracked build artifacts.

      - name: Hardcoded credential scan
        run: |
          patterns='sk-[A-Za-z0-9]{20,}|AIzaSy[A-Za-z0-9_-]{33}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if grep -rEn "$patterns" src/ frontend/src/ tests/; then
            echo "::error::Hardcoded credential found in source."
            exit 1
          fi
          echo "No hardcoded credentials found."

      - name: Reject committed build artifacts
        run: |
          if git ls-files | grep -Ev '^\.env\.example$' | grep -E '(^|/)(\.coverage|\.env|coverage\.xml|.*\.zip|.*\.tar\.gz)$'; then
            echo "::error::Build artifact or environment file is tracked in git."
            exit 1
          fi
          echo "No tracked build artifacts."
